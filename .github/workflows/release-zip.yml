name: Attach skills zip to release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the zip to"
        required: true

jobs:
  zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Structural validation
        run: node scripts/validate.mjs
      - name: Build appstack-skills.zip
        run: |
          cd plugins/appstack
          zip -r ../../appstack-skills.zip skills -x '.DS_Store' -x '**/.DS_Store'
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release view "$TAG" || gh release create "$TAG" --title "$TAG" --generate-notes
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" appstack-skills.zip --clobber
